server {
    listen      80;
    listen      443 ssl;
    server_name  localhost  git-server;

    ssl_certificate     /etc/nginx/ssl/git.crt;
    ssl_certificate_key /etc/nginx/ssl/git.key;

    client_max_body_size 0;
    root /srv/git;

    # ── 1.  If the request does **not** already end in “.git”, add it internally ──
    #       Handles  /repo              → /repo.git
    #                /repo/foo          → /repo.git/foo
    #                /user/repo         → /user/repo.git
    #                /user/repo/foo     → /user/repo.git/foo
    #       (no redirect – the client never notices)
    if ($uri !~ \.git(/|$)) {
        # $1 = /[optional user/]repo      ── $2 = /whatever-after-repo (may be empty)
        rewrite ^(/(?:[^/]+/)?[^/]+)(/.*)?$ $1.git$2 break;
    }

    # ── 2.  One location to serve every “…/.git/…” path (user prefix optional) ──
    location ~ ^/(?:[^/]+/)?(?<repo_path>[^/]+\.git)(?<rest>/.*)?$ {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME   /usr/lib/git-core/git-http-backend;
        fastcgi_param GIT_PROJECT_ROOT  /srv/git;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";

        # Strip the optional “user/” so the backend always sees /repo.git[…]
        fastcgi_param PATH_INFO         /$repo_path$rest;

        fastcgi_param QUERY_STRING      $query_string;
        fastcgi_param REQUEST_METHOD    $request_method;
        fastcgi_param CONTENT_TYPE      $content_type;

        fastcgi_pass unix:/var/run/fcgiwrap.socket;
    }
}

