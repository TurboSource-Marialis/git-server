server {
    listen      80;                # HTTP
    listen      443 ssl;           # HTTPS (optional)
    server_name localhost;

    # self-signed cert (you already have these)
    ssl_certificate     /etc/nginx/ssl/git.crt;
    ssl_certificate_key /etc/nginx/ssl/git.key;

    # allow big pushes
    client_max_body_size 0;

    # root for static “dumb” HTTP if you ever add dumb‐http support
    root /srv/git;

    location ~ (/.*\.git)(/.*)?$ {
        # pass all the usual CGI vars
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME   /usr/lib/git-core/git-http-backend;
        fastcgi_param GIT_PROJECT_ROOT  /srv/git;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";
        fastcgi_param PATH_INFO         $1$2;          # <repo>.git + any trailing path
        fastcgi_param QUERY_STRING      $query_string; # important for service=git-*
        fastcgi_param REQUEST_METHOD    $request_method;
        fastcgi_param CONTENT_TYPE      $content_type;
        fastcgi_pass                    unix:/var/run/fcgiwrap.socket;
    }
}

